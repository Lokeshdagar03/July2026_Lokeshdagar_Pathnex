---
- name: Implement SSH Key Authentication
  hosts: all
  become: yes

  tasks:
    - name: Generate SSH key pair
      command: ssh-keygen -t rsa -b 2048 -f /home/ec2-user/.ssh/id_rsa -N ""

    - name: Add SSH public key
      authorized_key:
        user: ec2-user
        state: present
        key: "{{ lookup('file', '/home/ec2-user/.ssh/id_rsa.pub') }}"